# Voyage email category classifiers
# Override path with VOYAGE_CLASSIFIERS_PATH env var
category_titles:
  flight: "Flights ✈️"
  hotel: "Hotels 🏨"
  cruise: "Cruises 🚢"
  car_rental: "Car Rental 🚗"
  activity: "Activities 🎟️"
  other: "Other 📧"
categories:
  flight:
    domains:
      - delta.com
      - united.com
      - aa.com
      - southwest.com
      - alaskaair.com
      - spirit.com
      - jetblue.com
      - frontier.com
    subject_keywords:
      - flight
      - eticket
      - e-ticket
      - boarding
      - confirmation
      - departing
      - arrives
      - itinerary
  hotel:
    domains:
      - marriott.com
      - hilton.com
      - hyatt.com
      - airbnb.com
      - vrbo.com
      - booking.com
      - expedia.com
      - ihg.com
    subject_keywords:
      - hotel
      - check-in
      - checkout
      - reservation
      - stay
      - resort
      - lodging
  cruise:
    domains:
      - carnival.com
      - royalcaribbean.com
      - ncl.com
      - princess.com
      - celebritycruises.com
    subject_keywords:
      - cruise
      - embarkation
      - port
      - stateroom
      - sailing
      - voyage
      - ship
  car_rental:
    domains:
      - hertz.com
      - enterprise.com
      - avis.com
      - budget.com
      - nationalcar.com
      - alamo.com
    subject_keywords:
      - rental
      - pick-up
      - vehicle
      - car reservation
      - pickup
  activity:
    domains:
      - disney.com
      - universalorlando.com
      - ticketmaster.com
      - viator.com
      - getyourguide.com
    subject_keywords:
      - ticket
      - admission
      - park
      - tour
      - experience
      - booking
