# Voyage email category classifiers
# Edit this file to add your own airlines, hotels, etc.
# No restart required — loaded on each request (or cached, implementation detail)
categories:
  flight:
    domains:
      - delta.com
      - united.com
      - aa.com
      - southwest.com
      - alaskaair.com
      - spirit.com
      - jetblue.com
      - frontier.com
    subject_keywords:
      - flight confirmation
      - eticket
      - boarding pass
      - your flight
      - departing
      - arrives
      - itinerary
  hotel:
    domains:
      - marriott.com
      - hilton.com
      - hyatt.com
      - ihg.com
      - bestwestern.com
      - airbnb.com
      - vrbo.com
      - hotels.com
      - booking.com
    subject_keywords:
      - hotel confirmation
      - check-in
      - checkout
      - reservation confirmed
      - your stay
      - resort
  cruise:
    domains:
      - carnival.com
      - royalcaribbean.com
      - ncl.com
      - princess.com
      - celebritycruises.com
      - hollandamerica.com
    subject_keywords:
      - cruise confirmation
      - embarkation
      - stateroom
      - sailing
      - port
  car_rental:
    domains:
      - hertz.com
      - enterprise.com
      - avis.com
      - budget.com
      - nationalcar.com
      - alamo.com
    subject_keywords:
      - rental confirmation
      - car reservation
      - pick-up
      - vehicle reservation
  activity:
    domains:
      - disney.com
      - universalorlando.com
      - ticketmaster.com
      - viator.com
      - getyourguide.com
    subject_keywords:
      - ticket confirmation
      - admission
      - park ticket
      - tour confirmation
      - experience
