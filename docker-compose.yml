version: '3.8'

services:
  # optional notmuch mail container
  # if you already have notmuch configured or running
  # on your host you can omit this service
  voyage-mail:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${NOTMUCH_DB_PATH:-./mail}:/mail
      - ${CONFIG_PATH:-./config}:/config
    environment:
      - SYNC_FREQUENCY=${SYNC_FREQUENCY:-15m}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - NOTMUCH_CONFIG=/config/notmuch/config
    restart: unless-stopped

  # API service for searching notmuch database
  voyage-api:
    image: ghcr.io/zachatrocity/voyage-backend:latest
    # For local development, comment out image and uncomment build:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8181}:8181"
    volumes:
      - ${NOTMUCH_DB_PATH:-./mail}:/mail
      - ${VOYAGE_NOTMUCH_CONFIG:-./config/notmuch/config}:/config/notmuch/config:ro
      - ${VOYAGE_CLASSIFIERS:-./configs/classifiers.yaml}:/app/configs/classifiers.yaml:ro
      - ${VOYAGE_TRIPS_DB:-./trips.json}:/app/trips.json
    env_file:
      - .env
    environment:
      - VOYAGE_PORT=8181
      - VOYAGE_MAIL_DIR=/mail
      - VOYAGE_NOTMUCH_CONFIG=/config/notmuch/config
      - VOYAGE_TRIPS_DB=/app/trips.json
      - VOYAGE_CLASSIFIERS=/app/configs/classifiers.yaml
      - VOYAGE_SYNC_CMD=${VOYAGE_SYNC_CMD:-./scripts/sync-mail.sh}
      - VOYAGE_ALLOWED_ORIGINS=${VOYAGE_ALLOWED_ORIGINS:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
    depends_on: # remove if bringing your own notmuch db
      - voyage-mail
    restart: unless-stopped
