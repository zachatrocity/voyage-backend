name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install libnotmuch-dev
        run: sudo apt-get update && sudo apt-get install -y libnotmuch-dev

      - name: Run tests
        run: go test ./...
